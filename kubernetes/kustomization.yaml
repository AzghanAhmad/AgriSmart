apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agrismart
resources:
  - namespace.yaml
  - configmaps/agrismart-config.yaml
  - secrets/agrismart-secrets.yaml
  - storage/postgres-pvc.yaml
  - storage/chroma-pvc.yaml
  - storage/uploads-pvc.yaml
  - storage/models-pvc.yaml
  - services/postgres-service.yaml
  - services/yolo-service.yaml
  - services/chatbot-service.yaml
  - services/backend-service.yaml
  - deployments/postgres-deployment.yaml
  - deployments/yolo-deployment.yaml
  - deployments/chatbot-deployment.yaml
  - deployments/backend-deployment.yaml
