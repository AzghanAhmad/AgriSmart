apiVersion: v1
kind: Secret
metadata:
  name: agrismart-secrets
  namespace: agrismart
type: Opaque
stringData:
  POSTGRES_DB: "agrismart"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  # Full URL for backend (K8s does not expand $(VAR) inside env value: fields)
  DATABASE_URL: "postgresql+psycopg2://postgres:postgres@postgres-service:5432/agrismart"
  SECRET_KEY: "change-me"
  # Optional provider keys (leave empty if unused)
  GROQ_API_KEY: ""
  XAI_API_KEY: ""
  OPENAI_API_KEY: ""
  # DagsHub / MLflow (training or offline jobs only; leave empty for inference-only clusters)
  DAGSHUB_USERNAME: ""
  DAGSHUB_TOKEN: ""
  DAGSHUB_REPO_NAME: ""
  # Optional: DAGSHUB_REPO_OWNER if different from username
  DAGSHUB_REPO_OWNER: ""
