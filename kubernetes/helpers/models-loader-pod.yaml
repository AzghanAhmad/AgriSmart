# One-off pod to copy local model files into models-data-pvc.
#
# 1) kubectl apply -f kubernetes/helpers/models-loader-pod.yaml
# 2) Wait until Running: kubectl wait -n agrismart --for=condition=Ready pod/models-loader --timeout=120s
# 3) From repo root (where ./models exists).
#    On Windows (especially OneDrive), recursive `kubectl cp ./models/. ...` can fail with:
#    archive/tar: unknown file mode ?rw-rw-rw-
#    Use individual files (see kubernetes/README.md) instead of copying the whole tree.
# 4) kubectl delete pod -n agrismart models-loader
# 5) kubectl rollout restart deployment/yolo-service deployment/backend -n agrismart
#
apiVersion: v1
kind: Pod
metadata:
  name: models-loader
  namespace: agrismart
spec:
  containers:
    - name: sleep
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: models
          mountPath: /models
  volumes:
    - name: models
      persistentVolumeClaim:
        claimName: models-data-pvc
  restartPolicy: Never
