apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: agrismart
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z postgres-service 5432; do echo waiting for postgres; sleep 2; done"]
        - name: wait-for-yolo-ready
          image: curlimages/curl:8.8.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until curl -fsS http://yolo-service:8001/ready; do echo waiting for yolo; sleep 3; done"]
        - name: wait-for-chatbot-ready
          image: curlimages/curl:8.8.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until curl -fsS http://chatbot-service:8002/ready; do echo waiting for chatbot; sleep 5; done"]
      containers:
        - name: backend
          image: agrismart-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: agrismart-config
            - secretRef:
                name: agrismart-secrets
          volumeMounts:
            - name: uploads-data
              mountPath: /app/Backend/static/uploads
            - name: models-data
              mountPath: /models
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
      volumes:
        - name: uploads-data
          persistentVolumeClaim:
            claimName: uploads-data-pvc
        - name: models-data
          persistentVolumeClaim:
            claimName: models-data-pvc
