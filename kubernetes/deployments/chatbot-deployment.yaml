apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-service
  namespace: agrismart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-service
  template:
    metadata:
      labels:
        app: chatbot-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: chatbot-service
          image: agrismart-chatbot:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 20"]
          ports:
            - containerPort: 8002
              name: http
          envFrom:
            - configMapRef:
                name: agrismart-config
            - secretRef:
                name: agrismart-secrets
          volumeMounts:
            - name: chroma-data
              mountPath: /app/Backend/chatbot/wheat_cotton_rice_db
            - name: models-data
              mountPath: /models
          startupProbe:
            httpGet:
              path: /ready
              port: 8002
            # Long model/chroma bootstrap window
            failureThreshold: 120
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 8
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "300m"
              memory: "1Gi"
            limits:
              cpu: "1500m"
              memory: "4Gi"
      volumes:
        - name: chroma-data
          persistentVolumeClaim:
            claimName: chroma-data-pvc
        - name: models-data
          persistentVolumeClaim:
            claimName: models-data-pvc
